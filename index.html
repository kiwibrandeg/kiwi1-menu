    }
  }

  loadMenu();

  // ===== خاصية البحث داخل المنيو =====
  // تعمل على العناصر المرسومة بالفعل (بدون إعادة رسم)، وتفتح تلقائيًا
  // أي قسم فرعي مغلق يحتوي على نتيجة مطابقة، وتعيد حالته عند مسح البحث.
  try {
    const searchInput = document.getElementById('menuSearch');
    const searchClear = document.getElementById('searchClear');
    const searchStatus = document.getElementById('searchStatus');

    if (searchInput && searchClear && searchStatus && menuWrap) {
      const normalize = (text) => String(text || '')
        .toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .trim();

      // نتذكر أي أقسام فرعية كانت مفتوحة قبل البحث لإعادتها كما كانت بعد المسح.
      const subsectionsOpenedBySearch = new Set();

      const clearHighlights = () => {
        menuWrap.querySelectorAll('mark.search-highlight').forEach(mark => {
          const parent = mark.parentNode;
          if (!parent) return;
          parent.replaceChild(document.createTextNode(mark.textContent), mark);
          parent.normalize();
        });
      };

      const highlightMatch = (nameEl, rawQuery) => {
        const original = nameEl.textContent;
        const normalizedOriginal = normalize(original);
        const normalizedQuery = normalize(rawQuery);
        const idx = normalizedOriginal.indexOf(normalizedQuery);
        if (idx === -1 || !normalizedQuery) return;
        // الطول قد يختلف بسبب التطبيع (توحيد الألف/الهاء)، فنستخدم طول الاستعلام كتقريب آمن للعرض.
        const end = Math.min(original.length, idx + normalizedQuery.length);
        const before = original.slice(0, idx);
        const match = original.slice(idx, end);
        const after = original.slice(end);
        if (!match) return;
        nameEl.textContent = '';
        nameEl.appendChild(document.createTextNode(before));
        const mark = document.createElement('mark');
        mark.className = 'search-highlight';
        mark.textContent = match;
        nameEl.appendChild(mark);
        nameEl.appendChild(document.createTextNode(after));
      };

      const runSearch = (rawQuery) => {
        const query = rawQuery.trim();
        clearHighlights();
        searchClear.hidden = query.length === 0;

        if (!query) {
          menuWrap.querySelectorAll('[data-search-hidden]').forEach(el => el.removeAttribute('data-search-hidden'));
          subsectionsOpenedBySearch.forEach(panel => {
            const button = document.querySelector(`[aria-controls="${panel.id}"]`);
            if (button) {
              button.setAttribute('aria-expanded', 'false');
              panel.classList.remove('open');
              panel.hidden = true;
            }
          });
          subsectionsOpenedBySearch.clear();
          searchStatus.hidden = true;
          return;
        }

        const normalizedQuery = normalize(query);
        let matchCount = 0;

        menuWrap.querySelectorAll('.subsection').forEach(subsection => {
          const items = subsection.querySelectorAll('.item');
          let subsectionHasMatch = false;

          items.forEach(item => {
            const name = item.getAttribute('data-item-name') || '';
            const isMatch = normalize(name).indexOf(normalizedQuery) !== -1;
            if (isMatch) {
              item.removeAttribute('data-search-hidden');
              const nameEl = item.querySelector('.item-name');
              if (nameEl) highlightMatch(nameEl, query);
              matchCount++;
              subsectionHasMatch = true;
            } else {
              item.setAttribute('data-search-hidden', 'true');
            }
          });

          if (subsectionHasMatch) {
            subsection.removeAttribute('data-search-hidden');
            const panel = subsection.querySelector('.subsection-items');
            const button = subsection.querySelector('.subsection-head');
            if (panel && button && button.getAttribute('aria-expanded') !== 'true') {
              button.setAttribute('aria-expanded', 'true');
              panel.hidden = false;
              panel.classList.add('open');
              subsectionsOpenedBySearch.add(panel);
            }
          } else {
            subsection.setAttribute('data-search-hidden', 'true');
          }
        });

        searchStatus.hidden = false;
        searchStatus.textContent = matchCount > 0
          ? `${matchCount} صنف مطابق`
          : 'مفيش أصناف مطابقة، جرّب كلمة تانية';
      };

      let debounceTimer = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = window.setTimeout(() => runSearch(searchInput.value), 120);
      });

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        runSearch('');
        searchInput.focus();
      });
    }
  } catch (error) {
    console.error('Kiwi menu: search feature failed (non-critical)', error);
  }

  // فقاعات الخلفية الزخرفية: تخطي إنشائها بالكامل لمن يفضّل تقليل الحركة،
  // بدل إنشائها ثم إيقاف حركتها فقط عبر CSS.
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReducedMotion) {
    try {
      const sizes = [40,70,55,90,35,60];
      const fragment = document.createDocumentFragment();
      sizes.forEach((size, index) => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = (10 + index * 17) + '%';
        bubble.style.top = (5 + (index % 3) * 30) + '%';
        bubble.style.animationDuration = (7 + index * 1.3) + 's';
        bubble.style.animationDelay = (index * 0.4) + 's';
        fragment.appendChild(bubble);
      });
      document.body.appendChild(fragment);
    } catch (error) {
      console.error('Kiwi menu: decorative bubbles failed (non-critical)', error);
    }
  }
</script>
</body>
</html>
